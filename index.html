<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KING HIGH SCHOOL SSC — Student Record App</title>
<style>
:root {
  --blue:#0d427d; --blue2:#1769aa; --light:#eef6fd; --line:#d9e6f2;
  --navy:#0a315f; --green:#0b8a62; --yellow:#f1c343; --text:#173b62;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f8fc;color:var(--text)}
header{background:linear-gradient(135deg,#0b3d75,#155b9d);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px #0b3d7526}
.header-inner{max-width:1050px;margin:auto;display:flex;align-items:center;gap:16px}
.logo{width:76px;height:76px;object-fit:contain;border-radius:14px;background:#fff;padding:4px;flex:none}
h1{margin:0;font-size:clamp(22px,4vw,36px);letter-spacing:.4px}
.subtitle{margin-top:5px;font-size:13px;opacity:.9;letter-spacing:1.5px}
main{max-width:1050px;margin:22px auto;padding:0 14px}
.panel,.profile,.empty{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 26px #174b7a12}
.panel{padding:18px}
.search-row{display:flex;gap:10px}
input,textarea{width:100%;border:2px solid #d9e5f0;border-radius:14px;padding:14px;font:inherit;color:var(--navy);outline:none;background:#fbfdff}
input:focus,textarea:focus{border-color:#2d7fc2}
button{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;min-height:50px}
.btn-blue{background:var(--blue);color:#fff}
.btn-clear{background:#e9f1f8;color:var(--blue)}
.btn-green{background:var(--green);color:#fff}
.btn-yellow{background:var(--yellow);color:#173b62}
.btn-dark{background:#12385f;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.help{margin:12px 0 0;color:#71879d;font-size:14px;line-height:1.5}
.status{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff6d9;color:#795900;font-size:13px}
.status.ok{background:#e8f8f1;color:#087052}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-top:18px}
.mini{padding:14px;display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;cursor:pointer}
.mini img{width:78px;height:78px;object-fit:cover;border-radius:14px;border:3px solid #1a70b1}
.mini strong{font-size:20px;color:var(--navy)}
.profile{margin-top:18px;padding:20px}
.profile-top{display:flex;gap:20px;align-items:flex-start}
.student-photo{width:180px;height:180px;object-fit:cover;border-radius:20px;border:5px solid #1670b4;background:#eef6fd}
.profile h2{margin:2px 0 4px;font-size:34px;color:var(--navy)}
.id-pill{display:inline-block;background:#176eb5;color:#fff;padding:9px 15px;border-radius:30px;font-weight:800;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{background:#f5f9fd;border:1px solid #dce9f4;border-radius:15px;padding:13px}
.field .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:#6a8198;margin-bottom:5px}
.field .value{font-size:16px;line-height:1.45;white-space:pre-wrap}
.address{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.editbox{margin-top:18px;padding:16px;border:2px dashed #a9c9e3;border-radius:18px;background:#f8fbfe}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.edit-grid .full{grid-column:1/-1}
.editbox label{font-size:12px;font-weight:800;color:#55718e;display:block;margin-bottom:6px}
.attachment{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}
.attachment-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.attachment-card{border:1px solid #d9e6f2;border-radius:14px;padding:8px;background:#f9fcff}
.attachment-card img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.attachment-card small{display:block;padding:7px 2px 2px;word-break:break-word}
.pdf-row{margin-top:18px;padding:14px;background:#fff8d9;border-radius:16px;border:1px solid #efd36b}
.pdf-row h3{margin:0 0 10px;color:#715700}
.empty{padding:35px 20px;text-align:center;color:#71879d;margin-top:18px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#12385f;color:#fff;padding:13px 18px;border-radius:14px;z-index:50;box-shadow:0 8px 25px #0003}
@media(max-width:650px){
  .header-inner{align-items:flex-start}
  .logo{width:62px;height:62px}
  .search-row{flex-direction:column}
  .profile-top{flex-direction:column}
  .student-photo{width:145px;height:145px}
  .grid,.edit-grid{grid-template-columns:1fr}
  .address,.edit-grid .full{grid-column:auto}
  .actions button{width:100%}
  .profile h2{font-size:29px}
}
@media print{
  body{background:#fff}
  header,.panel,.actions,.editbox,.pdf-row,.status,.results,.help{display:none!important}
  main{margin:0;padding:0}
  .profile{box-shadow:none;border:0;margin:0;padding:0}
}
</style>
</head>

let students = {};
let selectedId = null;
let editing = false;
let unsubscribe = null;

const $ = id => document.getElementById(id);
const showToast = msg => {
  $("toast").textContent = msg; $("toast").classList.remove("hidden");
  setTimeout(()=>$("toast").classList.add("hidden"),2500);
};

function configured() {
  return !Object.values(firebaseConfig).some(v => String(v).includes("PASTE_YOUR"));
}

function setStatus(msg, ok=false) {
  $("status").textContent=msg;
  $("status").className="status"+(ok?" ok":"");
}

function renderResults(list) {
  const box=$("results"); box.innerHTML="";
  list.forEach(s=>{
    const el=document.createElement("div"); el.className="mini";
    el.innerHTML=`<img src="${s.photo}" alt=""><div><strong>${esc(s.name)}</strong><div>${esc(s.id)}</div></div>`;
    el.onclick=()=>selectStudent(s.id);
    box.appendChild(el);
  });
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function current() { return students[selectedId]; }

function renderProfile() {
  const s=current();
  if(!s) { $("profileArea").innerHTML=""; $("empty").classList.remove("hidden"); return; }
  $("empty").classList.add("hidden");
  const attachments=(s.attachments||[]).map((a,i)=>`
    <div class="attachment-card">
      <img src="${a.data}" alt="">
      <small>${esc(a.name || "Attachment "+(i+1))}</small>
    </div>`).join("");

  $("profileArea").innerHTML=`
  <section class="profile">
    <div class="profile-top">
      <img class="student-photo" src="${s.photo}" alt="${esc(s.name)}">
      <div style="flex:1">
        <h2>${esc(s.name)}</h2>
        <div class="id-pill">${esc(s.id)}</div>
        <div class="grid">
          ${field("Student Name",s.name)}
          ${field("Student ID",s.id)}
          ${field("Gender",s.gender)}
          ${field("Date of Birth",s.dob)}
          ${field("Blood Group",s.blood)}
          ${field("Behaviour",s.behaviour)}
          ${field("Studies",s.studies)}
          ${field("Notes for Next Teacher",s.notes)}
          ${field("Address",s.address,"address")}
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-green" id="editBtn">✏️ Edit Details</button>
    </div>

    <div id="editBox"></div>

    <div class="attachment">
      <strong>Student Photos / Documents</strong>
      <div style="font-size:13px;color:#71879d;margin-top:5px">
        Add a suspension slip, project photo, certificate, or any other student-related image. Saved images sync through the same cloud record.
      </div>
      <div class="actions" style="margin-top:10px">
        <input id="photoFile" type="file" accept="image/*" multiple>
        <button class="btn-blue" id="uploadBtn">☁️ Add Photo(s)</button>
      </div>
      <div class="attachment-list">${attachments || "<div style='color:#71879d'>No extra photos added.</div>"}</div>
    </div>

    <div class="pdf-row">
      <h3>📄 PDF Options</h3>
      <div class="actions" style="margin-top:0">
        <button class="btn-yellow" id="pdfBtn">⬇️ Download PDF</button>
        <button class="btn-dark" id="printBtn">🖨️ Print</button>
      </div>
    </div>
  </section>`;
  $("editBtn").onclick=()=>openEditor();
  $("uploadBtn").onclick=uploadPhotos;
  $("pdfBtn").onclick=downloadPDF;
  $("printBtn").onclick=()=>window.print();
}

function field(label,value,cls="") {
 return `<div class="field ${cls}"><div class="label">${label}</div><div class="value">${esc(value || "—")}</div></div>`;
}

function openEditor() {
 const s=current(); editing=true;
 $("editBox").innerHTML=`
 <div class="editbox">
  <h3 style="margin-top:0;color:#0a315f">Edit Student Bio-Data</h3>
  <div class="edit-grid">
   ${input("name","Student Name",s.name)}
   ${input("id","Student ID",s.id)}
   ${input("gender","Gender",s.gender)}
   ${input("dob","Date of Birth",s.dob)}
   ${input("blood","Blood Group",s.blood)}
   ${input("behaviour","Behaviour",s.behaviour)}
   ${input("studies","Studies",s.studies)}
   ${textarea("notes","Notes for Next Teacher",s.notes)}
   ${textarea("address","Address",s.address,true)}
  </div>
  <div class="actions">
    <button class="btn-green" id="saveBtn">💾 Save Changes to Cloud</button>
    <button class="btn-clear" id="cancelBtn">Cancel</button>
  </div>
 </div>`;
 $("saveBtn").onclick=saveChanges;
 $("cancelBtn").onclick=()=>{editing=false;$("editBox").innerHTML="";};
}

function input(id,label,value) {
 return `<div><label>${label}</label><input id="e_${id}" value="${esc(value)}"></div>`;
}
function textarea(id,label,value,full=false) {
 return `<div class="${full?'full':''}"><label>${label}</label><textarea id="e_${id}" rows="3">${esc(value)}</textarea></div>`;
}

async function saveChanges() {
 const s={...current()};
 const newId=$("e_id").value.trim().toUpperCase();
 if(!newId) return showToast("Student ID is required.");
 const duplicate=Object.values(students).some(x=>x.id===newId && x.id!==s.id);
 if(duplicate) return showToast("That Student ID already belongs to another student.");
 Object.assign(s,{
   name:$("e_name").value.trim(), id:newId, gender:$("e_gender").value.trim(),
   dob:$("e_dob").value.trim(), blood:$("e_blood").value.trim(),
   behaviour:$("e_behaviour").value.trim(), studies:$("e_studies").value.trim(),
   notes:$("e_notes").value.trim(), address:$("e_address").value.trim()
 });
 if(!configured()) return showToast("Firebase config is not connected yet.");
 try {
   setStatus("Saving latest data to cloud…");
   await set(ref(db,"students/"+s.id),s);
   if(s.id!==selectedId) await set(ref(db,"students/"+selectedId),null);
   selectedId=s.id; editing=false;
   setStatus("Cloud connected — latest saved data is live on this device.",true);
   showToast("Saved to cloud. Other devices will receive it.");
 } catch(e) {
   console.error(e); setStatus("Cloud save failed: "+e.message); showToast("Could not save to Firebase.");
 }
}

async function uploadPhotos() {
 const files=[...($("photoFile").files||[])]; if(!files.length) return showToast("Choose one or more images first.");
 if(!configured()) return showToast("Firebase config is not connected yet.");
 const s=current();
 try {
   const additions=[];
   for(const f of files) {
     const data=await compressImage(f);
     additions.push({name:f.name,data});
   }
   s.attachments=[...(s.attachments||[]),...additions];
   await set(ref(db,"students/"+s.id),s);
   showToast("Photo(s) saved to cloud.");
 } catch(e) { console.error(e); showToast("Photo upload failed."); }
}

function compressImage(file) {
 return new Promise((resolve,reject)=>{
   const r=new FileReader(); r.onload=()=>{
     const img=new Image(); img.onload=()=>{
       const max=1200, scale=Math.min(1,max/Math.max(img.width,img.height));
       const c=document.createElement("canvas"); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
       c.getContext("2d").drawImage(img,0,0,c.width,c.height);
       resolve(c.toDataURL("image/jpeg",.82));
     }; img.onerror=reject; img.src=r.result;
   }; r.onerror=reject; r.readAsDataURL(file);
 });
}

function search() {
 const q=$("searchInput").value.trim().toLowerCase();
 if(!q) { renderResults(Object.values(students)); return; }
 const list=Object.values(students).filter(s=>s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q));
 renderResults(list);
 if(list.length===1) selectStudent(list[0].id);
 else if(!list.length) showToast("No student found.");
}
function selectStudent(id) {
 selectedId=id; renderProfile();
 window.scrollTo({top:0,behavior:"smooth"});
}
$("searchBtn").onclick=search;
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("clearBtn").onclick=()=>{ $("searchInput").value=""; $("results").innerHTML=""; selectedId=null; renderProfile(); $("empty").classList.remove("hidden"); };

function seedToObject() {
 const o={}; seedStudents.forEach(s=>o[s.id]=s); return o;
}

async function downloadPDF() {
 const s=current(); if(!s) return showToast("Select a student first.");
 const w=window.open("","_blank");
 if(!w) return showToast("Allow pop-ups for PDF.");
 const at=(s.attachments||[]).map(a=>`<div><img src="${a.data}" style="max-width:180px;max-height:180px;border-radius:8px"><p>${esc(a.name)}</p></div>`).join("");
 w.document.write(`<!doctype html><html><head><title>${esc(s.name)} - Student Record</title>
 <style>body{font-family:Arial;color:#173b62;margin:35px}h1{color:#0d427d}.logo{width:70px}.photo{width:160px;height:160px;object-fit:cover;border-radius:12px}.row{margin:9px 0;padding:9px;background:#f3f7fb;border-radius:7px}.label{font-size:11px;font-weight:bold;color:#67809a}.val{font-size:15px;margin-top:3px}.att{display:flex;gap:15px;flex-wrap:wrap}</style></head>
 <body><img class="logo" src="${document.querySelector(".logo").src}"><h1>KING HIGH SCHOOL SSC</h1><h2>${esc(s.name)} — ${esc(s.id)}</h2><img class="photo" src="${s.photo}">
 ${field("Student Name",s.name)}${field("Student ID",s.id)}${field("Gender",s.gender)}${field("Date of Birth",s.dob)}${field("Blood Group",s.blood)}${field("Behaviour",s.behaviour)}${field("Studies",s.studies)}${field("Notes for Next Teacher",s.notes)}${field("Address",s.address)}
 <h3>Student Photos / Documents</h3><div class="att">${at||"None"}</div><script>window.onload=()=>setTimeout(()=>window.print(),500)<\/script></body></html>`);
 w.document.close();
}

let app,db,auth;
if(!configured()) {
  setStatus("Firebase is not connected yet. Paste your real Firebase Web App config into this file, then enable Anonymous Authentication + Realtime Database.");
  students=seedToObject(); renderResults(Object.values(students));
} else {
  try {
    app=initializeApp(firebaseConfig); db=getDatabase(app); auth=getAuth(app);
    signInAnonymously(auth).catch(e=>{console.error(e);setStatus("Firebase Authentication error: "+e.message);});
    onAuthStateChanged(auth,user=>{
      if(!user) return;
      setStatus("Connected. Loading shared student data…");
      if(unsubscribe) unsubscribe();
      unsubscribe=onValue(ref(db,"students"),snap=>{
        const val=snap.val();
        if(!val) {
          const seeded=seedToObject();
          set(ref(db,"students"),seeded);
          students=seeded;
        } else {
          students=val;
        }
        if(selectedId && !students[selectedId]) selectedId=null;
        renderResults(Object.values(students));
        renderProfile();
        setStatus("Cloud connected — latest saved data is live on this device.",true);
      },err=>setStatus("Realtime Database error: "+err.message));
    });
  } catch(e) {
    console.error(e); students=seedToObject(); renderResults(Object.values(students));
    setStatus("Firebase setup error: "+e.message);
  }
}
</script>
</body>
</html>
